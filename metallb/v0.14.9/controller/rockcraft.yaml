name: metallb-controller
summary: Rock for the Metallb controller.
description: >
  This rock is a drop in replacement for the
  quay.io/metallb/controller image.
version: v0.14.9
license: Apache-2.0

base: bare
build-base: ubuntu@22.04
platforms:
  amd64:
  arm64:

entrypoint-service: controller
services:
  controller:
    command: /controller [ -h ]
    override: replace
    startup: enabled

parts:
  openssl:
    plugin: nil
    stage-packages:
      - openssl-fips-module-3
      - openssl

  controller:
    plugin: nil
    source-type: git
    source: https://github.com/metallb/metallb
    source-tag: v0.14.9
    source-depth: 1
    override-build: |
      # Note(ben): Override go.mod required Go version to 1.24
      # since there is a bug in go-snap 1.22 and 1.23 FIPS that
      # causes the build to not be fips compliant.
      snap refresh go --channel 1.24-fips/stable

      GIT_COMMIT=`git rev-parse HEAD`
      # We'll use the tag name.
      GIT_BRANCH=`git describe --tags --abbrev=0`

      export CGO_ENABLED=1
      export GOTOOLCHAIN=local
      export GOEXPERIMENT="opensslcrypto"
      go build -v -o $CRAFT_PART_INSTALL/controller \
        -tags "linux,cgo,ms_tls13kd" \
        -v -o $CRAFT_PART_INSTALL/controller \
        -ldflags "-X 'go.universe.tf/metallb/internal/version.gitCommit=${GIT_COMMIT}-tags-mstlskd' -X 'go.universe.tf/metallb/internal/version.gitBranch=${GIT_BRANCH}-tags-mstlskd'" \
        ./controller

      cp $CRAFT_PART_BUILD/LICENSE $CRAFT_PART_INSTALL/
